name: Build Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Build the web app
        working-directory: ./MagneqFrontend
        env:
          VITE_SERVER_URL: ${{ secrets.VITE_SERVER_URL }}
          VITE_NODE_ENV: ${{ secrets.VITE_NODE_ENV }}
        run: |
          echo "VITE_SERVER_URL=$VITE_SERVER_URL" > .env
          echo "VITE_NODE_ENV=$VITE_NODE_ENV" >> .env
          npm install --legacy-peer-deps
          npm run build

      - name: Wrap it as an Android project (Capacitor)
        working-directory: ./MagneqFrontend
        run: |
          npm install --no-save --legacy-peer-deps @capacitor/core@8 @capacitor/cli@8 @capacitor/android@8
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.magneqtransmission.app",
            "appName": "Magneq",
            "webDir": "dist",
            "server": { "androidScheme": "https" }
          }
          EOF
          npx cap add android
          npx cap sync android

      - name: Prepare Android SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" || echo "SDK install skipped; Gradle will fetch what it needs"

      - name: Build the APK
        working-directory: ./MagneqFrontend/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: magneq-android-apk
          path: MagneqFrontend/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
          if-no-files-found: error
